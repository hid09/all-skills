<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>__TITLE__</title>
<link rel="stylesheet" href="https://esm.sh/@xyflow/react@12/dist/style.css" />
<style>
  :root {
    --bg: #f1f1f4;
    --ink: #1d1f24;
    --ink-dim: rgba(29, 31, 36, 0.56);
    --ink-faint: rgba(29, 31, 36, 0.38);
    --glass: rgba(255, 255, 255, 0.66);
    --glass-strong: rgba(255, 255, 255, 0.86);
    --line: rgba(20, 22, 28, 0.11);
    --gold: #b8922f;
    --gold-text: #8a6d1f;
    --gold-soft: rgba(184, 146, 47, 0.14);
    --blue: rgba(60, 100, 180, 0.9);
    --danger: #b4322f;
    --ok: #2f8a4d;
    --font: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "SF Mono", "JetBrains Mono", "Cascadia Code", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body, #app { height: 100%; margin: 0; }
  body {
    background:
      radial-gradient(1200px 720px at 50% -10%, rgba(184, 146, 47, 0.08), transparent 60%),
      radial-gradient(900px 620px at 88% 112%, rgba(60, 100, 180, 0.07), transparent 60%),
      var(--bg);
    color: var(--ink); font-family: var(--font); -webkit-font-smoothing: antialiased;
  }
  .react-flow { width: 100%; height: 100%; }

  .topbar {
    position: absolute; z-index: 10; top: 18px; left: 22px; right: 22px;
    display: flex; align-items: flex-start; justify-content: space-between; pointer-events: none;
  }
  .brand { pointer-events: auto; }
  .brand h1 { margin: 0; font-size: 17.5px; font-weight: 660; letter-spacing: 0.3px; display: flex; align-items: center; gap: 9px; }
  .brand .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 10px rgba(184,146,47,0.6); }
  .brand p { margin: 6px 0 0 17px; font-size: 12.5px; color: var(--ink-dim); letter-spacing: 0.2px; }
  .actions { pointer-events: auto; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; max-width: 60%; }

  .btn {
    font-family: var(--font); font-size: 12.5px; color: var(--ink);
    background: var(--glass-strong); border: 1px solid var(--line);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    padding: 8px 13px; border-radius: 10px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    box-shadow: 0 3px 10px rgba(20,22,40,0.06); transition: all 0.18s ease;
    white-space: nowrap;
  }
  .btn:hover { background: #fff; border-color: rgba(20,22,28,0.2); transform: translateY(-1px); }
  .btn.primary { background: var(--gold-soft); border-color: rgba(184,146,47,0.5); color: var(--gold-text); font-weight: 600; }
  .btn.primary:hover { background: rgba(184,146,47,0.22); }
  .btn.danger { color: var(--danger); border-color: rgba(180,50,47,0.3); background: rgba(180,50,47,0.06); box-shadow: none; }
  .btn.danger:hover { background: rgba(180,50,47,0.12); }
  .btn.ghost { background: transparent; border: 1px dashed var(--line); box-shadow: none; color: var(--ink-dim); }
  .btn.ghost:hover { background: var(--glass); color: var(--ink); }

  /* 保存状态指示灯 */
  .savebar {
    pointer-events: auto;
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11.5px; color: var(--ink-dim);
    padding: 6px 10px; background: var(--glass);
    border: 1px solid var(--line); border-radius: 8px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .savebar .led { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 6px rgba(47,138,77,0.55); }
  .savebar.dirty .led { background: #d8a93a; box-shadow: 0 0 6px rgba(216,169,58,0.55); }
  .savebar.error .led { background: var(--danger); box-shadow: 0 0 6px rgba(180,50,47,0.55); }
  .savebar.dirty { color: #8a6d1f; }
  .savebar.error { color: var(--danger); }

  /* 节点（矩形 / 圆角条） */
  .gnode {
    position: relative; min-width: 168px; max-width: 232px;
    background: var(--glass); border: 1px solid var(--line);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-radius: 14px; padding: 13px 16px;
    box-shadow: 0 6px 22px rgba(20,22,40,0.09), inset 0 1px 0 rgba(255,255,255,0.7);
    transition: border-color 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease;
  }
  .gnode:hover { transform: translateY(-1px); box-shadow: 0 10px 28px rgba(20,22,40,0.13); }
  .react-flow__node.selected .gnode { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(184,146,47,0.3), 0 10px 28px rgba(20,22,40,0.14); }
  .gnode .gn-kicker { font-size: 10.5px; letter-spacing: 1.4px; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 5px; font-weight: 650; }
  .gnode .gn-title { font-size: 14.5px; font-weight: 660; line-height: 1.35; }
  .gnode .gn-sub { font-size: 12px; color: var(--ink-dim); margin-top: 5px; line-height: 1.45; }
  .gn-detail {
    margin-top: 10px; font-family: var(--font); font-size: 11px; color: var(--blue); font-weight: 560;
    background: rgba(60,100,180,0.08); border: 1px solid rgba(60,100,180,0.22);
    padding: 3px 10px; border-radius: 7px; cursor: pointer; transition: all 0.15s ease;
  }
  .gn-detail:hover { background: rgba(60,100,180,0.16); }
  .diamond-content .gn-detail { display: none; }
  .react-flow.exporting .gn-detail { display: none; }

  .gnode.gold {
    background: linear-gradient(158deg, var(--gold-soft), rgba(255,255,255,0.85));
    border-color: rgba(184, 146, 47, 0.6);
    box-shadow: 0 8px 26px rgba(184,146,47,0.18), inset 0 1px 0 rgba(255,255,255,0.8);
  }
  .gnode.gold .gn-title { color: var(--gold-text); }
  .gnode.gold .gn-kicker { color: var(--gold); }
  .gnode.muted { background: rgba(20,22,28,0.025); border: 1px dashed rgba(20,22,28,0.18); box-shadow: none; opacity: 0.78; }
  .gnode.muted .gn-title { color: var(--ink-dim); font-weight: 580; }
  .gnode.start { border-color: rgba(60, 100, 180, 0.42); }
  .gnode.start .gn-kicker { color: var(--blue); }

  /* 形状：起止（大圆角卡片） */
  .gnode.terminator { border-radius: 28px; padding: 13px 20px; }

  /* 形状：判断（扁菱形，SVG 多边形） */
  .gnode-wrap.decision { width: 180px; height: 76px; position: relative; display: flex; align-items: center; justify-content: center; }
  .diamond-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 5px 12px rgba(20,22,40,0.11)); transition: filter 0.18s ease; }
  .gnode-wrap.decision:hover .diamond-svg { filter: drop-shadow(0 9px 18px rgba(20,22,40,0.16)); }
  .react-flow__node.selected .diamond-svg polygon { stroke: var(--gold); stroke-width: 2; }
  .diamond-content { position: relative; z-index: 1; text-align: center; max-width: 112px; }
  .diamond-content .gn-kicker, .diamond-content .gn-sub { display: none; }
  .diamond-content .gn-title { font-size: 12.5px; font-weight: 500; color: var(--ink-dim); letter-spacing: 0; line-height: 1.4; }

  /* 导出扁平模式 */
  .react-flow.exporting .gnode {
    box-shadow: none !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important;
    background: #ffffff;
  }
  .react-flow.exporting .gnode.gold { background: #fbf4dd; }
  .react-flow.exporting .gnode.muted { background: #fafafa; }
  .react-flow.exporting .diamond-svg { filter: none !important; }

  .react-flow__handle { width: 7px; height: 7px; background: rgba(20,22,28,0.36); border: 1px solid #fff; opacity: 0.7; transition: opacity 0.18s ease, background 0.18s ease; }
  .react-flow__node:hover .react-flow__handle { opacity: 1; }
  .react-flow__handle:hover { background: var(--gold); opacity: 1; }
  /* 次级 handle (偏移位) 默认更淡 */
  .react-flow__handle.h-sub { background: rgba(20,22,28,0.22); width: 6px; height: 6px; opacity: 0.45; }
  .react-flow__node:hover .react-flow__handle.h-sub { opacity: 0.85; }

  .react-flow__edge-path { stroke: rgba(20,22,28,0.22); stroke-width: 1.5; }
  .react-flow__edge.animated .react-flow__edge-path { stroke: rgba(20,22,28,0.42); }
  .react-flow__edge-text { fill: var(--ink); font-size: 11px; font-family: var(--font); }
  .react-flow__edge-textbg { fill: #ffffff; }

  .react-flow__controls { box-shadow: 0 6px 18px rgba(20,22,40,0.12); border-radius: 10px; overflow: hidden; }
  .react-flow__controls-button { background: #fff; border-bottom: 1px solid rgba(20,22,28,0.07); color: var(--ink); }
  .react-flow__controls-button:hover { background: #f3f3f5; }
  .react-flow__controls-button svg { fill: var(--ink-dim); }
  .react-flow__minimap { border-radius: 10px; overflow: hidden; border: 1px solid var(--line); box-shadow: 0 6px 18px rgba(20,22,40,0.1); }
  .react-flow__attribution { background: transparent; color: var(--ink-faint); font-size: 10px; }
  .react-flow__attribution a { color: var(--ink-faint); }

  .editpanel {
    position: absolute; z-index: 20; top: 92px; right: 22px; width: 266px;
    background: var(--glass-strong); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--line); border-radius: 16px; padding: 16px 16px 14px; box-shadow: 0 16px 44px rgba(20,22,40,0.18);
  }
  .ep-head { display: flex; justify-content: space-between; align-items: center; font-size: 13.5px; font-weight: 660; }
  .ep-x { border: none; background: transparent; cursor: pointer; font-size: 14px; color: var(--ink-dim); padding: 2px 4px; }
  .ep-x:hover { color: var(--ink); }
  .ep-l { display: block; font-size: 11px; letter-spacing: 0.5px; color: var(--ink-faint); margin: 11px 0 5px; font-weight: 650; }
  .ep-i, .ep-t { width: 100%; font-family: var(--font); font-size: 13px; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; outline: none; }
  .ep-i:focus, .ep-t:focus { border-color: rgba(184,146,47,0.6); }
  .ep-t { resize: vertical; line-height: 1.45; }
  .ep-actions { display: flex; gap: 8px; margin-top: 15px; }
  .ep-actions .btn { flex: 1; }

  /* 详情浮层模态 */
  .detail-backdrop {
    position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; padding: 24px;
    background: rgba(20,22,28,0.28); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  }
  .detail-card {
    width: min(520px, 92vw); max-height: 80vh; overflow: auto;
    background: var(--glass-strong); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    border: 1px solid var(--line); border-radius: 18px; padding: 22px 24px;
    box-shadow: 0 30px 80px rgba(20,22,40,0.28);
  }
  .dc-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
  .dc-kicker { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--gold); font-weight: 680; }
  .dc-title { font-size: 18px; font-weight: 680; margin-top: 3px; line-height: 1.3; }
  .dc-body { font-size: 13.5px; line-height: 1.72; color: var(--ink); word-break: break-word; }
  .dc-body p { margin: 0 0 11px; }
  .dc-body a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; font-weight: 560; }
  .dc-body a:hover { color: #294e9c; }
  .dc-body code { font-family: var(--mono); font-size: 12.3px; background: rgba(20,22,28,0.06); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; word-break: break-all; }
  .dc-body pre { background: #1b1d22; color: #d6d8de; font-family: var(--mono); font-size: 12.3px; line-height: 1.62; padding: 12px 14px; border-radius: 10px; overflow-x: auto; margin: 8px 0 12px; white-space: pre-wrap; word-break: break-word; }
  .dc-body pre code { background: none; border: none; padding: 0; color: inherit; }
  .dc-body .os { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 10px; border-radius: 6px; margin: 14px 0 6px; }
  .dc-body .os.win { background: rgba(60,100,180,0.12); color: #294e9c; }
  .dc-body .os.mac { background: rgba(20,22,28,0.08); color: var(--ink); }
  .dc-body ul, .dc-body ol { margin: 6px 0 11px; padding-left: 20px; }
  .dc-body li { margin: 3px 0; }
  .dc-body .warn { color: #b4322f; font-weight: 560; }
  .dc-body .tip { background: var(--gold-soft); border-left: 3px solid var(--gold); padding: 8px 12px; border-radius: 0 8px 8px 0; margin: 8px 0 12px; font-size: 13px; }

  /* Toast 提示 */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: rgba(29, 31, 36, 0.92); color: #fff;
    padding: 10px 18px; border-radius: 10px; font-size: 12.5px;
    box-shadow: 0 10px 28px rgba(20,22,40,0.28); z-index: 50;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    animation: toastIn 0.22s ease-out;
  }
  .toast.err { background: rgba(180,50,47,0.94); }
  @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }
</style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?deps=react@18.3.1",
    "@xyflow/react": "https://esm.sh/@xyflow/react@12?deps=react@18.3.1,react-dom@18.3.1",
    "@dagrejs/dagre": "https://esm.sh/@dagrejs/dagre@1?bundle",
    "html-to-image": "https://esm.sh/html-to-image@1.11.13",
    "htm": "https://esm.sh/htm@3.1.1"
  }

</head>
<body>
<div id="app"></div>

<!-- ===== 流程数据：flowmaker 只需替换此 JSON 块 ===== -->
<script id="flow-data" type="application/json">
{
  "title": "示例流程",
  "subtitle": "双击节点 / 单击连线 编辑 · 拖圆点连线 · 改完自动保存",
  "direction": "TB",
  "nodes": [
    { "id": "a", "title": "开始", "kicker": "Start", "shape": "terminator", "variant": "start" },
    { "id": "b", "title": "处理步骤", "sub": "节点只写概述", "detail": "<p>详细内容放这里，<b>支持 HTML</b>：可点链接、代码块、分区。</p><p>点节点上的「详情 ▾」就弹出这个浮层，长内容不会撑乱画布。</p>" },
    { "id": "c", "title": "判断条件？", "shape": "decision" },
    { "id": "d", "title": "是 → 继续" },
    { "id": "e", "title": "否 → 退出", "variant": "muted" },
    { "id": "f", "title": "完成", "kicker": "End", "shape": "terminator", "variant": "gold" }
  ],
  "edges": [
    { "source": "a", "target": "b" },
    { "source": "b", "target": "c" },
    { "source": "c", "target": "d", "label": "是" },
    { "source": "c", "target": "e", "label": "否", "dashed": true },
    { "source": "d", "target": "f" }
  ]
}
</script>

<!-- 把原始页面 HTML 保存下来，给"导出 HTML"按钮用（必须在 React 挂载前抓） -->
<script>
  window.__FLOWMAKER_ORIGINAL_HTML__ = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
</script>

<script type="module">
import React, { useCallback, useState, useEffect, useRef, useMemo } from "react";
import { createRoot } from "react-dom/client";
import {
  ReactFlow, ReactFlowProvider, Background, Controls, MiniMap, Handle, Position,
  addEdge, useNodesState, useEdgesState, useReactFlow,
  getNodesBounds, getViewportForBounds, MarkerType
} from "@xyflow/react";
import dagre from "@dagrejs/dagre";
import { toPng } from "html-to-image";
import htm from "htm";

const html = htm.bind(React.createElement);
const DATA = JSON.parse(document.getElementById("flow-data").textContent);
const ARROW = { type: MarkerType.ArrowClosed, color: "rgba(20,22,28,0.42)" };

/* ============================================================
   持久化：localStorage
   key 用 title hash，避免同名互相覆盖
   ============================================================ */
const STORAGE_VERSION = "v2";
function hashStr(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) | 0; }
  return (h >>> 0).toString(36);
}
const STORAGE_KEY = "flowmaker:" + STORAGE_VERSION + ":" + hashStr(DATA.title || "untitled");

function loadSaved() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const data = JSON.parse(raw);
    if (data && Array.isArray(data.nodes) && Array.isArray(data.edges)) return data;
  } catch (e) { console.warn("[flowmaker] load saved failed", e); }
  return null;
}
function writeSaved(state) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    return { ok: true };
  } catch (e) {
    return { ok: false, err: e.message };
  }
}
function clearSaved() {
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
}

const SAVED = loadSaved();
const SOURCE = SAVED || DATA;
const INIT_DIRECTION = SOURCE.direction || DATA.direction || "TB";

/* ============================================================
   多 handle：每边 3 个 slot（保留旧的 center handle 做兼容）
   - 顶部 target:  t_l (25%) / t (50%, 旧) / t_r (75%)
   - 底部 source:  b_l / b (旧) / b_r
   - 左侧 target:  tl_t (25%) / tl (50%, 旧) / tl_b (75%)
   - 右侧 source:  r_t / r (旧) / r_b
   ============================================================ */
const HANDLE_SLOTS = {
  TB: { source: ["b_l", "b", "b_r"],   target: ["t_l", "t", "t_r"] },
  BT: { source: ["t_l", "t", "t_r"],   target: ["b_l", "b", "b_r"] },
  LR: { source: ["r_t", "r", "r_b"],   target: ["tl_t", "tl", "tl_b"] },
  RL: { source: ["tl_t", "tl", "tl_b"], target: ["r_t", "r", "r_b"] },
};

function pickSlot(slots, idx, total) {
  if (total <= 1) return slots[1]; // center
  const f = idx / (total - 1);     // 0..1
  return slots[Math.round(f * (slots.length - 1))];
}

/* ---------- 自定义节点 ---------- */
function GlassNode({ id, data }) {
  const v = data.variant ? " " + data.variant : "";
  const shape = data.shape || "process";
  const openDetail = (e) => {
    e.stopPropagation();
    window.dispatchEvent(new CustomEvent("flow-detail", { detail: id }));
  };
  const content = html`
    ${data.kicker ? html`<div class="gn-kicker">${data.kicker}</div>` : null}
    <div class="gn-title">${data.title}</div>
    ${data.sub ? html`<div class="gn-sub">${data.sub}</div>` : null}
    ${data.detail ? html`<button class="gn-detail" onMouseDown=${(e) => e.stopPropagation()} onClick=${openDetail}>详情 ▾</button>` : null}`;

  // 3 个 handle / 边：center 是旧的，左右是新增 sub
  const handles = html`
    <${React.Fragment}>
      <${Handle} type="target" position=${Position.Top}    id="t_l" className="h-sub" style=${{ left: "25%" }} />
      <${Handle} type="target" position=${Position.Top}    id="t" />
      <${Handle} type="target" position=${Position.Top}    id="t_r" className="h-sub" style=${{ left: "75%" }} />
      <${Handle} type="target" position=${Position.Left}   id="tl_t" className="h-sub" style=${{ top: "25%" }} />
      <${Handle} type="target" position=${Position.Left}   id="tl" />
      <${Handle} type="target" position=${Position.Left}   id="tl_b" className="h-sub" style=${{ top: "75%" }} />
      <${Handle} type="source" position=${Position.Bottom} id="b_l" className="h-sub" style=${{ left: "25%" }} />
      <${Handle} type="source" position=${Position.Bottom} id="b" />
      <${Handle} type="source" position=${Position.Bottom} id="b_r" className="h-sub" style=${{ left: "75%" }} />
      <${Handle} type="source" position=${Position.Right}  id="r_t" className="h-sub" style=${{ top: "25%" }} />
      <${Handle} type="source" position=${Position.Right}  id="r" />
      <${Handle} type="source" position=${Position.Right}  id="r_b" className="h-sub" style=${{ top: "75%" }} />
    <//>`;
  if (shape === "decision") {
    const dv = data.variant;
    const fill = dv === "gold" ? "#fbf4dd" : dv === "muted" ? "#f4f4f6" : "#ffffff";
    const stroke = dv === "gold" ? "rgba(184,146,47,0.7)"
      : dv === "muted" ? "rgba(20,22,28,0.24)"
      : dv === "start" ? "rgba(60,100,180,0.55)" : "rgba(20,22,28,0.2)";
    return html`
      <div class="gnode-wrap decision">
        ${handles}
        <svg class=${"diamond-svg" + v} viewBox="0 0 180 76" preserveAspectRatio="none">
          <polygon points="90,3 177,38 90,73 3,38"
            fill=${fill} stroke=${stroke} stroke-width="1.4" stroke-linejoin="round"
            stroke-dasharray=${dv === "muted" ? "5 4" : "0"} />
        </svg>
        <div class="diamond-content">${content}</div>
      </div>`;
  }
  return html`<div class=${"gnode " + shape + v}>${handles}${content}</div>`;
}
const nodeTypes = { glass: GlassNode };

/* ---------- 尺寸估算（供 dagre 自动布局） ---------- */
function sizeOf(d) {
  if ((d.shape || "process") === "decision") return [180, 76];
  if (d.shape === "terminator") return [200, d.sub ? 78 : 58];
  return [200, d.sub ? 90 : 62];
}

/* ---------- 构建 nodes / edges ---------- */
function buildNodes(rawNodes) {
  return rawNodes.map((d) => {
    const [w, h] = sizeOf(d);
    return {
      id: d.id, type: "glass",
      position: { x: d.x ?? 0, y: d.y ?? 0 },
      data: { title: d.title, sub: d.sub || "", kicker: d.kicker || "", detail: d.detail || "", shape: d.shape || "process", variant: d.variant || "" },
      _w: w, _h: h, _placed: d.x !== undefined && d.y !== undefined,
    };
  });
}
function buildEdges(rawEdges) {
  return rawEdges.map((e, i) => ({
    id: e.id || ("e" + i), source: e.source, target: e.target,
    sourceHandle: e.sh || "b", targetHandle: e.th || "t",
    type: "smoothstep", animated: e.animated ?? !e.dashed,
    label: e.label || undefined,
    labelStyle: { fill: "#1d1f24", fontWeight: 500 },
    labelBgStyle: { fill: "#ffffff" },
    labelBgPadding: [7, 4], labelBgBorderRadius: 6,
    markerEnd: ARROW,
    data: { dashed: !!e.dashed },
    style: e.dashed
      ? { stroke: "rgba(20,22,28,0.18)", strokeWidth: 1.5, strokeDasharray: "5 4" }
      : { stroke: "rgba(20,22,28,0.42)", strokeWidth: 1.5 },
  }));
}

/* ---------- dagre 自动布局（任一节点缺坐标即触发） ---------- */
function autoLayout(nodes, edges, direction) {
  if (nodes.every((n) => n._placed)) return nodes;
  const g = new dagre.graphlib.Graph();
  g.setGraph({ rankdir: direction || "TB", nodesep: 60, ranksep: 100, edgesep: 24, marginx: 28, marginy: 28 });
  g.setDefaultEdgeLabel(() => ({}));
  nodes.forEach((n) => g.setNode(n.id, { width: n._w, height: n._h }));
  edges.forEach((e) => g.setEdge(e.source, e.target));
  dagre.layout(g);
  return nodes.map((n) => {
    const p = g.node(n.id);
    return { ...n, position: { x: p.x - n._w / 2, y: p.y - n._h / 2 } };
  });
}

/* ---------- 智能分配 handle（缓解连线缠绕） ---------- */
function assignHandles(nodes, edges, direction) {
  const slots = HANDLE_SLOTS[direction] || HANDLE_SLOTS.TB;
  const nodeMap = new Map(nodes.map((n) => [n.id, n]));

  // 主轴：决定 source/target 用顶底还是左右
  // 副轴：用来排序同一节点的多条入/出边，让它们均匀分布
  const isVertical = direction === "TB" || direction === "BT";
  const minorKey = isVertical ? "x" : "y";

  const incoming = new Map();
  const outgoing = new Map();
  for (const e of edges) {
    if (!incoming.has(e.target)) incoming.set(e.target, []);
    incoming.get(e.target).push(e);
    if (!outgoing.has(e.source)) outgoing.set(e.source, []);
    outgoing.get(e.source).push(e);
  }
  // 按"对端节点的副轴坐标"排序，让线在自家节点上从左到右/从上到下均匀排开
  for (const arr of incoming.values()) {
    arr.sort((a, b) => {
      const an = nodeMap.get(a.source), bn = nodeMap.get(b.source);
      return (an?.position?.[minorKey] ?? 0) - (bn?.position?.[minorKey] ?? 0);
    });
  }
  for (const arr of outgoing.values()) {
    arr.sort((a, b) => {
      const an = nodeMap.get(a.target), bn = nodeMap.get(b.target);
      return (an?.position?.[minorKey] ?? 0) - (bn?.position?.[minorKey] ?? 0);
    });
  }
  return edges.map((e) => {
    const inArr = incoming.get(e.target) || [];
    const outArr = outgoing.get(e.source) || [];
    const tIdx = inArr.indexOf(e);
    const sIdx = outArr.indexOf(e);
    return {
      ...e,
      sourceHandle: pickSlot(slots.source, sIdx, outArr.length),
      targetHandle: pickSlot(slots.target, tIdx, inArr.length),
    };
  });
}

/* ---------- 状态序列化（保存 / 导出） ---------- */
function serializeState(nodes, edges, direction, title, subtitle) {
  return {
    title: title || DATA.title,
    subtitle: subtitle ?? DATA.subtitle,
    direction,
    nodes: nodes.map((n) => {
      const o = {
        id: n.id,
        title: n.data.title,
        x: Math.round(n.position.x),
        y: Math.round(n.position.y),
      };
      if (n.data.sub) o.sub = n.data.sub;
      if (n.data.kicker) o.kicker = n.data.kicker;
      if (n.data.detail) o.detail = n.data.detail;
      if (n.data.shape && n.data.shape !== "process") o.shape = n.data.shape;
      if (n.data.variant) o.variant = n.data.variant;
      return o;
    }),
    edges: edges.map((e) => {
      const o = { source: e.source, target: e.target };
      if (e.label) o.label = e.label;
      if (e.data?.dashed || e.style?.strokeDasharray) o.dashed = true;
      if (e.sourceHandle && e.sourceHandle !== "b") o.sh = e.sourceHandle;
      if (e.targetHandle && e.targetHandle !== "t") o.th = e.targetHandle;
      return o;
    }),
  };
}

function downloadFile(content, filename, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* ---------- App ---------- */
let eseq = 1;
const INIT_EDGES_RAW = buildEdges(SOURCE.edges);
const INIT_NODES_RAW = buildNodes(SOURCE.nodes);
// 如果是 saved（全有坐标），直接用；否则跑 dagre + 智能 handle 分配
const INIT_NODES = autoLayout(INIT_NODES_RAW, INIT_EDGES_RAW, INIT_DIRECTION);
const INIT_EDGES = SAVED
  ? INIT_EDGES_RAW  // 保存版尊重用户手工连线
  : assignHandles(INIT_NODES, INIT_EDGES_RAW, INIT_DIRECTION);

function Flow() {
  const [nodes, setNodes, onNodesChange] = useNodesState(INIT_NODES);
  const [edges, setEdges, onEdgesChange] = useEdgesState(INIT_EDGES);
  const [direction, setDirection] = useState(INIT_DIRECTION);
  const [editId, setEditId] = useState(null);
  const [editEdgeId, setEditEdgeId] = useState(null);
  const [detailId, setDetailId] = useState(null);
  const [helpOpen, setHelpOpen] = useState(false);
  const [saveState, setSaveState] = useState({ status: SAVED ? "saved" : "clean", msg: SAVED ? "已恢复自动保存" : "" });
  const [toast, setToast] = useState(null);
  const dirtyRef = useRef(false);
  const initRef = useRef(true);
  const { getNodes, screenToFlowPosition } = useReactFlow();

  /* ---- 详情浮层事件 ---- */
  useEffect(() => {
    const h = (e) => setDetailId(e.detail);
    window.addEventListener("flow-detail", h);
    return () => window.removeEventListener("flow-detail", h);
  }, []);

  /* ---- toast 自动消失 ---- */
  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(() => setToast(null), 2200);
    return () => clearTimeout(t);
  }, [toast]);

  /* ---- 自动保存（debounce 1.5s） ---- */
  useEffect(() => {
    if (initRef.current) { initRef.current = false; return; }
    dirtyRef.current = true;
    setSaveState((s) => s.status === "error" ? s : { status: "dirty", msg: "未保存" });
    const t = setTimeout(() => {
      const state = serializeState(nodes, edges, direction, DATA.title, DATA.subtitle);
      const r = writeSaved(state);
      if (r.ok) {
        dirtyRef.current = false;
        setSaveState({ status: "saved", msg: "已自动保存" });
      } else {
        setSaveState({ status: "error", msg: "保存失败：" + (r.err || "未知") });
      }
    }, 1500);
    return () => clearTimeout(t);
  }, [nodes, edges, direction]);

  /* ---- 手动保存 ---- */
  const onSave = useCallback(() => {
    const state = serializeState(nodes, edges, direction, DATA.title, DATA.subtitle);
    const r = writeSaved(state);
    if (r.ok) {
      dirtyRef.current = false;
      setSaveState({ status: "saved", msg: "已保存到本地" });
      setToast({ msg: "✓ 已保存到浏览器本地" });
    } else {
      setSaveState({ status: "error", msg: "保存失败：" + r.err });
      setToast({ msg: "✗ 保存失败：" + r.err, err: true });
    }
  }, [nodes, edges, direction]);

  /* ---- 导出 JSON ---- */
  const onExportJSON = useCallback(() => {
    const state = serializeState(nodes, edges, direction, DATA.title, DATA.subtitle);
    const json = JSON.stringify(state, null, 2);
    const fn = (DATA.title || "flowchart").replace(/[\\/:*?"<>|]/g, "_") + ".json";
    downloadFile(json, fn, "application/json");
    setToast({ msg: "✓ 已导出 JSON" });
  }, [nodes, edges, direction]);

  /* ---- 导出 HTML（自包含，可双击打开） ---- */
  const onExportHTML = useCallback(() => {
    const state = serializeState(nodes, edges, direction, DATA.title, DATA.subtitle);
    const json = JSON.stringify(state, null, 2);
    const original = window.__FLOWMAKER_ORIGINAL_HTML__;
    if (!original) { setToast({ msg: "✗ 无法获取原始模板", err: true }); return; }
    const newHTML = original.replace(
      /<script id="flow-data"[^>]*>[\s\S]*?<\/script>/,
      '<script id="flow-data" type="application/json">\n' + json + '\n<' + '/script>'
    );
    const fn = (DATA.title || "flowchart").replace(/[\\/:*?"<>|]/g, "_") + ".html";
    downloadFile(newHTML, fn, "text/html");
    setToast({ msg: "✓ 已导出独立 HTML" });
  }, [nodes, edges, direction]);

  /* ---- 导入 JSON ---- */
  const onImportJSON = useCallback(() => {
    const input = document.createElement("input");
    input.type = "file"; input.accept = "application/json,.json";
    input.onchange = (e) => {
      const f = e.target.files?.[0]; if (!f) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const data = JSON.parse(ev.target.result);
          if (!Array.isArray(data.nodes) || !Array.isArray(data.edges)) throw new Error("缺少 nodes/edges");
          const newEdges = buildEdges(data.edges);
          const newNodesRaw = buildNodes(data.nodes);
          const newNodes = autoLayout(newNodesRaw, newEdges, data.direction || direction);
          setNodes(newNodes);
          setEdges(newEdges);
          if (data.direction) setDirection(data.direction);
          setToast({ msg: "✓ 已导入：" + (data.title || f.name) });
        } catch (err) {
          setToast({ msg: "✗ 导入失败：" + err.message, err: true });
        }
      };
      reader.readAsText(f, "utf-8");
    };
    input.click();
  }, [direction, setNodes, setEdges]);

  /* ---- 重排（重跑 dagre + 智能 handle） ---- */
  const onRelayout = useCallback(() => {
    const cleared = nodes.map((n) => ({ ...n, _placed: false, _w: sizeOf(n.data)[0], _h: sizeOf(n.data)[1] }));
    const laid = autoLayout(cleared, edges, direction);
    const wired = assignHandles(laid, edges, direction);
    setNodes(laid);
    setEdges(wired);
    setToast({ msg: "✓ 已重新排版" });
  }, [nodes, edges, direction, setNodes, setEdges]);

  /* ---- 切换方向 + 同时重排 ---- */
  const onToggleDirection = useCallback(() => {
    const next = direction === "TB" ? "LR" : direction === "LR" ? "BT" : direction === "BT" ? "RL" : "TB";
    const cleared = nodes.map((n) => ({ ...n, _placed: false, _w: sizeOf(n.data)[0], _h: sizeOf(n.data)[1] }));
    const laid = autoLayout(cleared, edges, next);
    const wired = assignHandles(laid, edges, next);
    setDirection(next);
    setNodes(laid);
    setEdges(wired);
    setToast({ msg: "✓ 方向：" + next });
  }, [direction, nodes, edges, setNodes, setEdges]);

  /* ---- 重置（清空本地，回到初始 DATA） ---- */
  const onReset = useCallback(() => {
    if (!window.confirm("确认重置？将清除本地自动保存，回到文件初始版本。")) return;
    clearSaved();
    location.reload();
  }, []);

  /* ---- 导出 PNG ---- */
  const onExportPNG = useCallback(() => {
    const vpEl = document.querySelector(".react-flow__viewport");
    const rootEl = document.querySelector(".react-flow");
    if (!vpEl) return;
    const bounds = getNodesBounds(getNodes());
    const w = Math.round(bounds.width * 2) + 200;
    const h = Math.round(bounds.height * 2) + 200;
    const vp = getViewportForBounds(bounds, w, h, 0.2, 4, 0.14);
    if (rootEl) rootEl.classList.add("exporting");
    toPng(vpEl, {
      backgroundColor: "#f1f1f4", width: w, height: h, pixelRatio: 2,
      style: { width: w + "px", height: h + "px",
        transform: `translate(${vp.x}px, ${vp.y}px) scale(${vp.zoom})` },
    }).then((dataUrl) => {
      const a = document.createElement("a");
      a.download = (DATA.title || "flowchart") + ".png";
      a.href = dataUrl; a.click();
      setToast({ msg: "✓ 已导出 PNG" });
    }).catch((err) => {
      setToast({ msg: "✗ 导出 PNG 失败：" + err.message, err: true });
    }).finally(() => { if (rootEl) rootEl.classList.remove("exporting"); });
  }, [getNodes]);

  const editNode = nodes.find((n) => n.id === editId) || null;
  const editEdge = edges.find((e) => e.id === editEdgeId) || null;
  const detailNode = nodes.find((n) => n.id === detailId) || null;

  const onConnect = useCallback((params) => {
    const id = "ne_" + (eseq++);
    setEdges((eds) => addEdge({ ...params, id, type: "smoothstep", animated: true, label: "",
      labelStyle: { fill: "#1d1f24", fontWeight: 500 }, labelBgStyle: { fill: "#ffffff" },
      labelBgPadding: [7, 4], labelBgBorderRadius: 6, markerEnd: ARROW,
      data: { dashed: false },
      style: { stroke: "rgba(20,22,28,0.42)", strokeWidth: 1.5 } }, eds));
    setEditId(null); setEditEdgeId(id);
  }, [setEdges]);

  const onNodeDoubleClick = useCallback((_e, node) => { setEditEdgeId(null); setEditId(node.id); }, []);
  const onEdgeClick = useCallback((_e, edge) => { setEditId(null); setEditEdgeId(edge.id); }, []);

  const onField = useCallback((field, value) => {
    setNodes((nds) => nds.map((n) => n.id === editId ? { ...n, data: { ...n.data, [field]: value } } : n));
  }, [editId, setNodes]);
  const onEdgeLabel = useCallback((value) => {
    setEdges((eds) => eds.map((e) => e.id === editEdgeId ? { ...e, label: value } : e));
  }, [editEdgeId, setEdges]);

  const deleteNode = useCallback(() => {
    setEdges((eds) => eds.filter((e) => e.source !== editId && e.target !== editId));
    setNodes((nds) => nds.filter((n) => n.id !== editId));
    setEditId(null);
  }, [editId, setNodes, setEdges]);
  const deleteEdge = useCallback(() => {
    setEdges((eds) => eds.filter((e) => e.id !== editEdgeId));
    setEditEdgeId(null);
  }, [editEdgeId, setEdges]);

  /* 新节点定位到视口中心，不再堆左上角 */
  const addNode = useCallback(() => {
    const id = "n_" + (eseq++);
    let pos = { x: 120, y: 120 };
    try {
      const rect = document.querySelector(".react-flow")?.getBoundingClientRect();
      if (rect && screenToFlowPosition) {
        pos = screenToFlowPosition({ x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 });
        pos.x -= 100; pos.y -= 30;
      }
    } catch (e) {}
    setNodes((nds) => nds.concat({ id, type: "glass", position: pos,
      data: { title: "新节点", sub: "双击改名 · 拖圆点连线", kicker: "", detail: "", shape: "process", variant: "" } }));
    setEditEdgeId(null); setEditId(id);
  }, [setNodes, screenToFlowPosition]);

  /* Ctrl+S 快捷保存 */
  useEffect(() => {
    const h = (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === "s") { e.preventDefault(); onSave(); }
    };
    window.addEventListener("keydown", h);
    return () => window.removeEventListener("keydown", h);
  }, [onSave]);

  const savebarClass = "savebar " + (saveState.status === "dirty" ? "dirty" : saveState.status === "error" ? "error" : "");
  const dirLabel = direction === "TB" ? "↓ 上→下" : direction === "LR" ? "→ 左→右" : direction === "BT" ? "↑ 下→上" : "← 右→左";

  return html`
    <${React.Fragment}>
      <div class="topbar">
        <div class="brand">
          <h1><span class="dot"></span>${DATA.title || "flowmaker"}</h1>
          ${DATA.subtitle ? html`<p>${DATA.subtitle}</p>` : null}
          <p style=${{ marginTop: 4 }}>
            <span class=${savebarClass} title=${saveState.msg}>
              <span class="led"></span>${saveState.msg || (saveState.status === "saved" ? "已保存" : "")}
            </span>
          </p>
        </div>
        <div class="actions">
          <button class="btn primary" onClick=${onSave} title="把当前所有改动写入浏览器本地存档（Ctrl+S）。下次打开同一文件会自动恢复。">💾 保存</button>
          <button class="btn" onClick=${onRelayout} title="清除所有手动拖动的位置，按当前方向重新自动排版，并智能分配连线端口以减少缠绕。改乱了一键救命。">🔄 重排</button>
          <button class="btn" onClick=${onToggleDirection} title="循环切换布局方向：上→下 / 左→右 / 下→上 / 右→左。切换时自动重排。">${dirLabel}</button>
          <button class="btn" onClick=${addNode} title="在视口中心插入一个新节点，并打开编辑面板。">＋ 节点</button>
          <button class="btn" onClick=${onExportHTML} title="把当前状态（含您所有改动）打包成一个独立 HTML 文件下载。双击即开，可发同事，可丢 git。">📤 HTML</button>
          <button class="btn" onClick=${onExportJSON} title="只导出 nodes/edges 数据（轻量，适合 git 版本管理）。可用「📂 导入」还原。">📥 JSON</button>
          <button class="btn" onClick=${onImportJSON} title="从本地 .json 文件导入流程图（覆盖当前画布）。">📂 导入</button>
          <button class="btn" onClick=${onExportPNG} title="导出高清 PNG 截图（导出时自动隐藏「详情 ▾」按钮）。">🖼 PNG</button>
          <button class="btn ghost" onClick=${onReset} title="清除本地自动存档，回到文件最初的版本。不影响已导出的文件。">↺ 重置</button>
          <button class="btn ghost" onClick=${() => setHelpOpen(true)} title="按钮和操作说明">❓</button>
        </div>
      </div>

      <${NodePanel} node=${editNode} onField=${onField} onDelete=${deleteNode} onClose=${() => setEditId(null)} />
      <${EdgePanel} edge=${editEdge} onLabel=${onEdgeLabel} onDelete=${deleteEdge} onClose=${() => setEditEdgeId(null)} />
      <${DetailModal} node=${detailNode} onClose=${() => setDetailId(null)} />
      <${HelpModal} open=${helpOpen} onClose=${() => setHelpOpen(false)} />

      ${toast ? html`<div class=${"toast" + (toast.err ? " err" : "")}>${toast.msg}</div>` : null}

      <${ReactFlow}
        nodes=${nodes} edges=${edges} nodeTypes=${nodeTypes}
        onNodesChange=${onNodesChange} onEdgesChange=${onEdgesChange} onConnect=${onConnect}
        onNodeDoubleClick=${onNodeDoubleClick} onEdgeClick=${onEdgeClick}
        fitView fitViewOptions=${{ padding: 0.2 }} minZoom=${0.3}
        deleteKeyCode=${["Backspace", "Delete"]}
      >
        <${Background} variant="dots" gap=${26} size=${1} color="rgba(20,22,28,0.06)" />
        <${MiniMap} pannable zoomable maskColor="rgba(241,241,244,0.7)" style=${{ background: "#ffffff" }}
          nodeColor=${(n) => n.data?.variant === "gold" ? "#d8b24a" : n.data?.variant === "muted" ? "rgba(20,22,28,0.18)" : "rgba(20,22,28,0.4)"} />
        <${Controls} showInteractive=${false} />
      <//>
    <//>`;
}

function App() {
  return html`<${ReactFlowProvider}><${Flow} /><//>`;
}

createRoot(document.getElementById("app")).render(html`<${App} />`);
</script>
</body>
</html>
